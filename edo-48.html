  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { width: min(100% - 32px, 1280px); margin: 32px auto; }
  canvas { display: block; width: 100%; height: auto; background: #1d2a2f; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;

    padding: 14px 0;
  }
  button, select {

    border-radius: 6px;
    color: inherit;
    min-height: 42px;
    padding: 0 13px;
    font: inherit;
  }
  button:enabled { cursor: pointer; }
  button:disabled { opacity: .66; }
  :focus-visible { outline: 2px solid #e4b778; outline-offset: 3px; }
  input[type="range"] { flex: 1 1 180px; accent-color: #e4b778; cursor: pointer; }
  output { font-variant-numeric: tabular-nums; min-width: 94px; font-size: .9rem; }
  #export-status:empty { display: none; }
  #export-status { color: #e4b778; margin: 0 0 12px; }
  details { color: #cbd3cf; font-size: 0.95rem; line-height: 1.7; }
  details a { color: #f2d4a8; }
  @media (max-width: 520px) {
    main { width: calc(100% - 20px); margin: 10px auto 20px; }
    select { flex: 1; max-width: calc(100% - 84px); }
    #position { order: 3; min-width: 0; flex-basis: 50%; }
    #time { order: 4; }
  }
</style>
</head>

<main>

    <button id="play" type="button">播放</button>

    <output id="time" for="position" aria-hidden="true"></output>
    <button id="export" type="button">重新渲染 MP4</button>

  <p id="export-status" role="status"></p>
  <details>

function clamp(value, low = 0, high = 1) {
  return Math.max(low, Math.min(high, value));
}

function smooth(value) {
  const x = clamp(value);
  return x * x * (3 - 2 * x);
}

function mix(a, b, t) {
  return a + (b - a) * t;
}

function line(ctx, points, color, width = 1) {
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for (const point of points.slice(1)) ctx.lineTo(...point);
  ctx.lineWidth = width;
  ctx.strokeStyle = color;
  ctx.stroke();
}

function rect(ctx, x, y, w, h, fill, border, radius = 0) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
  if (border) {
    ctx.lineWidth = 1;
    ctx.strokeStyle = border;
    ctx.stroke();
  }
}

function dot(ctx, x, y, r, fill, border) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
  if (border) {
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = border;
    ctx.stroke();
  }
}

function text(ctx, value, x, y, size, color = palette.paper, options = {}) {
  const {font = sans, weight = 400, align = 'left', maxWidth} = options;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color;
  if (maxWidth) ctx.fillText(value, x, y, maxWidth);
  else ctx.fillText(value, x, y);
}

function arrow(ctx, x, y, facing, color, length = 35) {
  const end = x + length * facing;
  line(ctx, [[x, y], [end, y]], color, 1.5);
  line(ctx, [[end - 6 * facing, y - 5], [end, y], [end - 6 * facing, y + 5]],
    color, 1.5);
}

function figure(ctx, cx, cy, pose, colors, movement, scale = 1.22) {
  const stroke = colors[0];
  const pale = colors[1];
  const rig = poses[pose.base];
  const points = Object.fromEntries(joints.map((key, index) => {
    const [x, y] = rig[index];
    const [dx, dy] = pose.adjust?.[key] ?? [0, 0];
    const isLimb = ['elbow', 'hand', 'farElbow', 'farHand', 'knee', 'farKnee'].includes(key);
    const initialOffset = isLimb ? 6 * (1 - movement) : 0;
    return [key, [(x + dx - initialOffset) * pose.facing, y + dy + initialOffset * .65]];
  }));
  const p = points;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const farStroke = colors[2];
  line(ctx, [p.hip, p.farKnee, p.farFoot], farStroke, 13);
  line(ctx, [p.shoulder, p.farElbow, p.farHand], farStroke, 11);
  line(ctx, [p.hip, p.knee, p.foot], stroke, 15);
  line(ctx, [p.foot, [p.foot[0] + 10 * pose.facing, p.foot[1]]], stroke, 10);
  line(ctx, [p.shoulder, p.hip], stroke, 30);
  line(ctx, [p.shoulder, p.elbow, p.hand], stroke, 13);
  const neck = [mix(p.shoulder[0], p.head[0], .46), mix(p.shoulder[1], p.head[1], .46)];
  line(ctx, [p.shoulder, neck], stroke, 13);
  dot(ctx, p.head[0], p.head[1], 17, pale, stroke);
  line(ctx, [[p.head[0] + pose.facing * 7, p.head[1] + 2],
    [p.head[0] + pose.facing * 12, p.head[1] + 2]], stroke, 1.4);
  dot(ctx, p.elbow[0], p.elbow[1], 3.4, pale);
  dot(ctx, p.knee[0], p.knee[1], 3.7, pale);

  // The small rings mark the joints or limbs set against the guide line.
  const ringOpacity = .85 * smooth((movement - .55) / .45);
  ctx.globalAlpha *= ringOpacity;
  for (const key of ['foot', 'farFoot', 'knee', 'farKnee', 'hand', 'farHand', 'hip', 'shoulder']) {
    const [x, y] = p[key];
    if (y >= 77) dot(ctx, x, y, 5, pale, stroke);
  }
  ctx.restore();
}

function symbolic(ctx, x, y, index, second, accent, movement) {
  const centerX = x + 277;
  const kind = index - 40;
  const dir = second ? -1 : 1;
  const bilateral = kind === 2 || kind >= 4;
  const active = bilateral || (kind === 1 ? second : !second);
  const stacked = kind === 2 || kind === 4;
  const up = kind === 2 ? !second : second;
  const centerY = y + (stacked ? (up ? 123 : 202) : 157);
  const hand = kind === 3;
  if (bilateral) {
    const guides = stacked ? [y + 123, y + 202] : [centerY];
    for (const guideY of guides) {
      line(ctx, [[x + 152, guideY], [x + 402, guideY]], '#c2bbab');
    }
  }
  ctx.save();
  ctx.globalAlpha *= .8 + .2 * movement;
  if (hand && active) {
    rect(ctx, centerX - 22, centerY - 22, 44, 44, accent, null, 8);
  } else {
    dot(ctx, centerX, centerY, 25, active ? accent : null, accent);
  }
  if (active) {
    const direction = stacked && kind === 4 ? -dir : dir;
    arrow(ctx, centerX + (38 + 4 * movement) * direction, centerY, direction, accent, 35);
  }
  ctx.restore();
}

function drawPanel(ctx, entry, index, secondary, movement) {
  const x = cardX[secondary ? 1 : 0];
  const y = 223;
  const w = 554;
  const h = 295;
  const colors = secondary ? colorB : colorA;
  const accent = colors[0];
  rect(ctx, x, y, w, h, secondary ? palette.paperDim : palette.paper, null, 4);
  rect(ctx, x + 21, y + 19, 37, 37, accent, null, 2);
  text(ctx, secondary ? '乙' : '甲', x + 39.5, y + 45, 20, '#fff9ed',
    {align:'center', weight:700});
  text(ctx, secondary ? entry.b : entry.a, x + 73, y + 45, 23, palette.darkText,
    {maxWidth: w - 110, weight:600});
  line(ctx, [[x + 22, y + 67], [x + w - 22, y + 67]], '#bdbaa9');

  if (!entry.poses) {
    symbolic(ctx, x, y, index, secondary, accent, movement);
    return;
  }
  const pose = entry.poses[secondary ? 1 : 0];
  const scale = ['stand', 'lift'].includes(pose.base) ? 1.05 : 1.14;
  const floor = y + 265;
  const baseY = floor - 82 * scale;
  const guide = '#bfb9a7';
  line(ctx, [[x + 142, floor + 2], [x + w - 142, floor + 2]], guide);
  line(ctx, [[x + 142, floor - 2], [x + 142, floor + 6]], guide);
  line(ctx, [[x + w - 142, floor - 2], [x + w - 142, floor + 6]], guide);
  figure(ctx, x + w / 2, baseY + 6 * (1 - movement), pose, colors, movement, scale);
}

}

const byteString = value => Uint8Array.from(value, char => char.charCodeAt(0));

function words(values, size) {
  const result = new Uint8Array(values.length * size);
  const view = new DataView(result.buffer);
  values.forEach((value, index) => {
    if (size === 2) view.setUint16(index * size, value);
    else view.setUint32(index * size, value);
  });
  return result;
}

const u16 = (...values) => words(values, 2);
const u32 = (...values) => words(values, 4);
const zero = count => new Uint8Array(count);

function concat(parts) {
  const result = new Uint8Array(parts.reduce((sum, part) => sum + part.byteLength, 0));
  let offset = 0;
  for (const part of parts) {
    result.set(part, offset);
    offset += part.byteLength;
  }
  return result;
}

function box(type, ...parts) {
  return concat([u32(8 + parts.reduce((sum, part) => sum + part.byteLength, 0)),
    byteString(type), ...parts]);
}

function fullBox(type, flags, ...parts) {
  return box(type, u32(flags), ...parts);
}

function muxMP4(samples, avcConfig) {
  const timescale = 24000;
  const frameDuration = timescale / FPS;
  const duration = frameDuration * samples.length;
  const unity = 0x00010000;
  const matrix = u32(unity, 0, 0, 0, unity, 0, 0, 0, 0x40000000);
  const geometry = u32(WIDTH * unity, HEIGHT * unity);
  const ftyp = box('ftyp', byteString('isom'), u32(512), byteString('isomiso2avc1mp41'));
  const sync = samples.flatMap((sample, index) => sample.key ? [index + 1] : []);

  // One contiguous video chunk with constant frame durations and no reordering.
  const avc1 = box('avc1', zero(6), u16(1), zero(16), u16(WIDTH, HEIGHT),
    u32(0x00480000, 0x00480000, 0), u16(1), zero(32), u16(24, 0xffff),
    box('avcC', avcConfig));
  const stsd = fullBox('stsd', 0, u32(1), avc1);
  const stts = fullBox('stts', 0, u32(1, samples.length, frameDuration));
  const stsc = fullBox('stsc', 0, u32(1, 1, samples.length, 1));
  const stsz = fullBox('stsz', 0, u32(0, samples.length),
    words(samples.map(sample => sample.data.byteLength), 4));
  const stss = fullBox('stss', 0, u32(sync.length), words(sync, 4));
  const dinf = box('dinf', fullBox('dref', 0, u32(1), fullBox('url ', 1)));
  const vmhd = fullBox('vmhd', 1, zero(8));
  const mdhd = fullBox('mdhd', 0, u32(0, 0, timescale, duration), u16(0x7fff, 0));
  const hdlr = fullBox('hdlr', 0, u32(0), byteString('vide'), zero(12),
    byteString('Canvas Video'), zero(1));
  const tkhd = fullBox('tkhd', 7, u32(0, 0, 1, 0, duration),
    zero(16), matrix, geometry);
  const mvhd = fullBox('mvhd', 0, u32(0, 0, timescale, duration, unity),
    u16(0x0100), zero(10), matrix, zero(24), u32(2));

  const movie = offset => {
    const stbl = box('stbl', stsd, stts, stss, stsc, stsz,
      fullBox('stco', 0, u32(1, offset)));
    const mdia = box('mdia', mdhd, hdlr, box('minf', vmhd, dinf, stbl));
    return box('moov', mvhd, box('trak', tkhd, mdia));
  };
  const moov = movie(ftyp.byteLength + movie(0).byteLength + 8);
  const dataLength = samples.reduce((sum, sample) => sum + sample.data.byteLength, 0);
  return new Blob([ftyp, moov, u32(dataLength + 8), byteString('mdat'),
    ...samples.map(sample => sample.data)], {type:'video/mp4'});
}

async function exportFilm({onProgress = () => {}} = {}) {
  if (!window.VideoEncoder || !window.VideoFrame) {
    throw new Error('此瀏覽器未提供逐幀編碼功能，請使用已附的 MP4。');
  }
  const config = {
    codec:'avc1.42001f', width:WIDTH, height:HEIGHT,
    framerate:FPS, bitrate:2_300_000, hardwareAcceleration:'prefer-software',
    latencyMode:'realtime', avc:{format:'avc'}
  };
  const support = await VideoEncoder.isConfigSupported(config);
  if (!support.supported) {
    throw new Error('此瀏覽器不支援 H.264 編碼，請使用已附的 MP4。');
  }
  await document.fonts.ready;
  const capture = document.createElement('canvas');
  capture.width = WIDTH;
  capture.height = HEIGHT;
  const ctx = capture.getContext('2d', {alpha:false});
  const samples = [];
  let avcConfig;
  let failure;
  const encoder = new VideoEncoder({
    output(chunk, metadata) {
      if (!avcConfig && metadata.decoderConfig?.description) {
        avcConfig = new Uint8Array(metadata.decoderConfig.description).slice();
      }
      const data = new Uint8Array(chunk.byteLength);
      chunk.copyTo(data);
      samples.push({data, key:chunk.type === 'key', timestamp:chunk.timestamp});
    },
    error(error) { failure = error; }
  });
  try {
    encoder.configure(config);
    onProgress(0, TOTAL_FRAMES);
    for (let frameIndex = 0; frameIndex < TOTAL_FRAMES; frameIndex++) {
      if (failure) throw failure;
      while (encoder.encodeQueueSize > 7 && !failure) {
        await new Promise(resolve => setTimeout(resolve, 0));
      }
      if (failure) throw failure;
      const seconds = frameIndex / FPS;
      drawFrame(ctx, seconds);
      const timestamp = Math.round(seconds * 1e6);
      const duration = Math.round((frameIndex + 1) * 1e6 / FPS) - timestamp;
      const frame = new VideoFrame(capture, {timestamp, duration});
      try {
        const chapterStart = frameIndex >= INTRO * FPS &&
          (frameIndex - INTRO * FPS) % (CARD * FPS) === 0;
        encoder.encode(frame, {keyFrame:frameIndex === 0 || chapterStart});
      } finally {
        frame.close();
      }
      if ((frameIndex + 1) % FPS === 0) onProgress(frameIndex + 1, TOTAL_FRAMES);
    }
    await encoder.flush();
    if (failure) throw failure;
    if (!avcConfig || samples.length !== TOTAL_FRAMES ||
        samples.some((sample, index) => sample.timestamp !== Math.round(index * 1e6 / FPS))) {
      throw new Error('輸出影格的數量或時間軸異常。');
    }
    return muxMP4(samples, avcConfig);
  } finally {
    if (encoder.state !== 'closed') encoder.close();
  }
}

const canvas = document.querySelector('#film');
const ctx = canvas.getContext('2d', {alpha:false});
const playButton = document.querySelector('#play');
const position = document.querySelector('#position');
const time = document.querySelector('#time');
const chapters = document.querySelector('#chapters');
const exportButton = document.querySelector('#export');
const status = document.querySelector('#export-status');
let playedSeconds = 0;
let animationFrame;
let playbackOrigin;

function timestamp(seconds) {
  return `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2,'0')}`;
}

function seekFilm(seconds) {
  playedSeconds = clamp(seconds, 0, DURATION);
  const frame = Math.min(Math.floor(playedSeconds * FPS), TOTAL_FRAMES - 1);
  drawFrame(ctx, frame / FPS);
  position.value = playedSeconds;
  time.value = `${timestamp(playedSeconds)} / ${timestamp(DURATION)}`;
  const section = playedSeconds < INTRO
    ? 0
    : Math.min(Math.floor((playedSeconds - INTRO) / CARD) + 1, entries.length + 1);
  chapters.selectedIndex = section;
}

function pause() {
  cancelAnimationFrame(animationFrame);
  animationFrame = undefined;
  playButton.textContent = '播放';
}

function tick(now) {
  seekFilm((now - playbackOrigin) / 1000);
  if (playedSeconds < DURATION) animationFrame = requestAnimationFrame(tick);
  else pause();
}

function movePlayhead(seconds) {
  seekFilm(seconds);
  if (animationFrame !== undefined) playbackOrigin = performance.now() - playedSeconds * 1000;
}

position.max = DURATION;
const options = [new Option('片頭', 0)];
entries.forEach((entry, index) => {
  const number = String(index + 1).padStart(2, '0');
  options.push(new Option(`${number}　${entry.name}`, INTRO + index * CARD));
});
options.push(new Option('片尾與來源', DURATION - OUTRO));
chapters.replaceChildren(...options);

playButton.addEventListener('click', () => {
  if (animationFrame !== undefined) {
    pause();
    return;
  }
  if (playedSeconds >= DURATION) seekFilm(0);
  playbackOrigin = performance.now() - playedSeconds * 1000;
  playButton.textContent = '暫停';
  animationFrame = requestAnimationFrame(tick);
});
position.addEventListener('input', () => movePlayhead(Number(position.value)));
chapters.addEventListener('change', () => movePlayhead(Number(chapters.value)));
exportButton.addEventListener('click', async () => {
  pause();
  exportButton.disabled = true;
  status.textContent = '正在渲染影格…';
  try {
    const video = await exportFilm({
      onProgress(done, count) {
        status.textContent = `已提交影格 ${done.toLocaleString()} / ${count.toLocaleString()}`;
      }
    });
    const url = URL.createObjectURL(video);
    const download = document.createElement('a');
    download.href = url;
    download.download = 'edo-48.mp4';
    download.click();
    setTimeout(() => URL.revokeObjectURL(url), 60_000);
    status.textContent = 'MP4 已完成。';
  } catch (error) {
    status.textContent = error.message;
  } finally {
    exportButton.disabled = false;
  }
});

window.seekFilm = seekFilm;
window.exportFilm = exportFilm;
window.filmInfo = {duration:DURATION, frameRate:FPS, frameCount:TOTAL_FRAMES};
seekFilm(0);
document.fonts.ready.then(() => seekFilm(playedSeconds));

</script>
</body>
</html>
